name: verify

on:
  push:
  pull_request:

jobs:
  host:
    strategy:
      fail-fast: false
      matrix:
        compiler: [g++, clang++]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CXX: ${{ matrix.compiler }}
    steps:
      - uses: actions/checkout@v4
      - name: Install host crypto headers
        run: sudo apt-get update && sudo apt-get install -y libssl-dev
      - name: Verify host/reference baseline
        run: make verify-all
